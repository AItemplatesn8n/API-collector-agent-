<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Collector Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #333;
    }
    .subtitle {
      color: #666;
      margin-bottom: 24px;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:active { transform: scale(0.98); }
    .key-item {
      background: #f5f5f5;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .key-value {
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin: 8px 0;
    }
    .status {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      text-align: center;
    }
    .waiting { background: #fff3cd; color: #856404; }
    .success { background: #d4edda; color: #155724; }
    .reveal-btn, .copy-btn {
      padding: 8px 16px;
      font-size: 14px;
      width: auto;
      margin: 4px;
      display: inline-block;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🔑 API Collector Agent</h1>
    <p class="subtitle">Real browser automation • Manual login/OTP • Auto extraction</p>
    
    <textarea id="platforms" rows="3" placeholder="Enter platforms (comma-separated)&#10;Example: OpenAI, AWS, Google, GitHub"></textarea>
    <button id="startBtn">🚀 Start Collection</button>
    
    <div id="status"></div>
    <button id="resumeBtn" style="background:#28a745; display:none;">✅ I've completed OTP/Login - Resume</button>
  </div>
  
  <div class="card">
    <h2>📦 Extracted Keys</h2>
    <div id="keysList"></div>
  </div>
</div>

<script>
  let serverUrl = window.location.origin;
  
  document.getElementById('startBtn').onclick = async () => {
    const platforms = document.getElementById('platforms').value.split(',').map(p => p.trim());
    
    document.getElementById('status').innerHTML = '<div class="status waiting">🌐 Opening browser session... Please check new window</div>';
    document.getElementById('resumeBtn').style.display = 'block';
    
    const res = await fetch(serverUrl + '/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ platforms })
    });
    
    document.getElementById('status').innerHTML = '<div class="status waiting">🔐 Please login and complete OTP/CAPTCHA, then click Resume button below</div>';
  };
  
  document.getElementById('resumeBtn').onclick = async () => {
    document.getElementById('status').innerHTML = '<div class="status waiting">🤖 Extracting API keys from settings page...</div>';
    
    const res = await fetch(serverUrl + '/resume', { method: 'POST' });
    const data = await res.json();
    
    document.getElementById('status').innerHTML = '<div class="status success">✅ Keys extracted successfully!</div>';
    loadKeys();
    document.getElementById('resumeBtn').style.display = 'none';
  };
  
  async function loadKeys() {
    const res = await fetch(serverUrl + '/keys');
    const keys = await res.json();
    
    const container = document.getElementById('keysList');
    container.innerHTML = keys.map(k => `
      <div class="key-item">
        <strong>${k.platform}</strong> - ${new Date(k.timestamp).toLocaleTimeString()}
        <div class="key-value" id="key-${k.timestamp}">••••••••••••••••</div>
        <div class="btn-group">
          <button class="copy-btn" onclick="copyKey('${k.keys.join(',')}')">📋 Copy</button>
          <button class="reveal-btn" onclick="revealKey(this, '${k.keys.join(',')}')">👁️ Reveal</button>
        </div>
      </div>
    `).join('');
  }
  
  window.copyKey = (key) => {
    navigator.clipboard.writeText(key);
    alert('Copied!');
  };
  
  window.revealKey = (btn, key) => {
    const keyDiv = btn.parentElement.previousElementSibling;
    if (keyDiv.innerText === '••••••••••••••••') {
      keyDiv.innerText = key;
      btn.innerText = '🙈 Hide';
    } else {
      keyDiv.innerText = '••••••••••••••••';
      btn.innerText = '👁️ Reveal';
    }
  };
  
  loadKeys();
</script>
</body>
</html>
